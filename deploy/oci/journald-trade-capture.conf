# OPTIONAL, host-wide: /etc/systemd/journald.conf.d/trade-capture.conf
# Recorder stdout/stderr go to the journal (boot volume), never to the archive
# volume. Bounded so logs cannot eat the boot volume. It limits every service's
# journal, so install.sh does not install it; the owner decides (README.md).
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=4G
MaxRetentionSec=90day
