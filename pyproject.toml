[project]
name = "trade-investing-panel"
version = "0.1.0"
description = "Safety-first research and paper-trading foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "tzdata>=2025.1",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
