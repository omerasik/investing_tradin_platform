r0_operations:                # the T4 clock; runs beside every phase
  status: running             # BTCUSDT production contract v1, default root
  command: scripts/capture_bybit_public.py supervise --segment-seconds 3600
  operating_mode: >-
    Hourly bounded segments on the UTC grid (2026-10-02). The host is shut down
    often; a shutdown now loses only the open hour (PARTIAL, excluded) instead
    of an unfinalized day. Each segment is its own session with head and
    closing clock samples (PR #164); the seconds between segments are real
    gaps and coverage is never claimed across a segment boundary.
  host_clock_finding: >-
    2026-09-24: Windows Time service (W32Time) is not running on the capture
    host and the host clock read ~9.47 s behind Bybit server time (RTT-bounded,
    +/- 0.18 s). Arrival timestamps are recorded on this clock. R1A records
    RTT-bounded offset samples in every session's lifecycle log as evidence;
    no arrival is ever adjusted. Enabling time sync is an owner action (system
    setting). Sessions recorded before sync carry this offset and R2A/R3A must
    decide their admissibility from the recorded evidence. Still stopped on
    2026-10-04; sealed venue-minus-host upper bounds grew from 0.22-0.26 s
    (10-02) to 0.45-0.48 s (10-03) and 0.74-0.79 s (10-04). Seals stay
    conservative (max upper bound), but knowledge times widen as it drifts.
    2026-10-05T23:12Z, after a host restart: +64 ms +/- 126 ms (W32Time still
    stopped, Manual); seal cfbe615a upper bounds 0.29-0.34 s. Drift will regrow.
  single_instance: >-
    run/supervise/measure hold an OS-released lock on their archive root (a second
    recorder exits 4); 'capture_bybit_public.py status' shows both roots;
    scripts/start_r0_capture.ps1 starts R0 unless a recorder process exists and
    installs nothing (-ShowLogonTaskCommand only prints an owner opt-in).
  outages_2026_10_07: >-
