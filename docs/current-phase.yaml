phase:
  id: "3D.7R.2"
  name: Scalable canonical feature materialization
  status: in_review          # PR open
  base_commit: 1488856       # 3D.7R.1 (PR #138) merged, exact-main CI green

# Why this phase exists: the 150-day composite f07ebfc1-... is SEALED, but its
# canonical features ran at ~26/min (~7 days): every basis event ran two dataset-wide
# ranked lookups (~450 ms each), every OI event a current lookup plus a full
# historical prior search, and every feature its own write transaction. Stopped at
# basis 491/216,000 and OI change 0/43,199.

next:
  id: "3D.7"
  name: Complete canonical features on the existing 150-day composite
  rule: >-
    Operational only, after this PR is merged and exact-main CI is green. No
    provider call, no reseal, no second composite; the 491 existing basis rows
    must reconcile as identical evidence.

scope:
  - src/trade_platform/crypto_derivatives_features.py
  - src/trade_platform/open_interest_features.py
  - src/trade_platform/feature_authority.py
  - src/trade_platform/historical_acquisition.py
  - tests/test_feature_materialization_batch_postgres.py

acceptance:
  - Evidence resolves in one streamed dataset-scoped query per feature, not per event.
  - Writes commit in bounded chunks through PostgresFeatureAuthority, with exact
    per-row content-hash reconciliation; identical replay idempotent, conflict fails closed.
  - Values, manifests, PIT/revision/ambiguity rules and V2 hashes identical to the
    per-event path; no formula, semantic or calculation version change; no migration.
  - All 491 existing 150-day basis rows and the complete seven-day composite
    (10,080 basis, 2,015 OI change) reproduce exactly, read-only.

safety_gates:
  - No schema migration, no provider call, no broker/account/order call.

validation:
  iterate: python -m unittest tests.test_feature_materialization_batch_postgres
  adjacent: feature, acquisition and composition *_postgres modules on a disposable DB
  before_done: ruff check src tests migrations scripts && python scripts/check_mypy_baseline.py && bandit -q -r src/trade_platform
  ci_owns: full suite, Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
