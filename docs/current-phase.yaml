phase:
  id: "3D.9S.2B"
  name: Canonical captured-source authority and provenance contract
  status: open_for_owner_review
  base_commit: 43d366f       # 3D.9S.2A (PR #143) merged

# 3D.9A froze the preregistration packet. 3D.9B cannot run because of the
# blocker below, which is an EVIDENCE-SOURCE problem, not a code problem:
# the canonical 150-day Bybit REST dataset f07ebfc1-19ce-4757-af4b-10525f6a6992
# sets effective_at = computed bar_close_at (bybit_crypto_provider.py:463).
# That is an assumption about when a value became knowable; the V5 REST
# historical endpoints publish no finality or revision history that proves it.
blocker:
  id: UNPROVEN_DISTINCT_FEATURE_DECISION_TIMES
  consequence: >-
    All 216,000 canonical basis materializations share one knowledge_at, so
    every decision_at collapses to a single post-span instant and any
    open-to-open run would admit zero decisions.

preflight_3d9s1:              # research only; concluded, no adapter, no purchase
  candidate: tardis.dev historical Bybit V5 capture
  result: TARDIS_PIT_SOURCE_FEASIBLE
  key_facts:
    - Capture is the real-time wss://stream.bybit.com/v5/public feed, never
      rebuilt from REST; per-message recorder arrival timestamp at 100ns.
    - tickers carries markPrice and indexPrice ASYNCHRONOUSLY, so a causal
      pairing rule is mandatory, not optional.

pilot_3d9s2a:                 # concluded (PR #143); zero-cost, no purchase
  result: TARDIS_CAPTURE_ENGINEERING_PROVEN
  lifecycle: RESEARCH_ENGINEERING_EVIDENCE_ONLY
  evidence: >-
    32,839 tickers and 15,361 publicTrade records replayed from the free
    first-of-month feed over 20 contiguous minutes each on 2026-05-01,
    2026-06-01, 2026-07-01 and 2026-08-01 (all pre-holdout): 8,353 basis
    observations carrying 8,353 DISTINCT research_available_at instants, 80
    deterministic 1m bars, three represented collection gaps. Each bar carries
    OPEN availability and completed-bar availability separately; a completed
    minute is knowable only at max(bar_close_at, last contributing arrival).
    No performance, no P&L, no parameter ranking.
  local_only: >-
    The free sample is vendor data and is never committed. The integration test
    is skipped unless TARDIS_FREE_SAMPLE_DIR points at a local read-only copy.

authority_3d9s2b:             # THIS phase; contract only, no data, no purchase
  decision: >-
    Tardis historical Bybit V5 public WebSocket capture is authorized as a
    SECOND exact research-data source contract for BTCUSDT linear perpetual,
    under the fail-closed semantics the zero-cost pilot proved.
  scope_paths:
    - src/trade_platform/canonical_captured_source_authority_v1.py
    - src/trade_platform/real_market_data_provenance_v1.py
    - tests/test_canonical_captured_source_authority_v1.py
    - tests/test_real_market_data_provenance_v1.py
  canonical_captured_source_id: b4f161e8-3ebd-53f5-bfdb-e527f598b08a
  contract_content_hash: 3fda40738e2ee176dcd7df19b9616c33f636f97181dc4b1a8df8330693c2c105
  key_facts:
    - Capture provider (tardis), originating exchange (BYBIT) and Tardis' own
      exchange label (bybit) are three separate fields; none grants authority.
    - Channels tickers + publicTrade only; vendor-generated records refused;
      source_available_at is the recorder clock and is never written into
      effective_at or ingested_at.
    - Provider-published (mark, index, public trades) stays separate from
      platform-derived (PIT basis, reconstructed 1m OHLCV, features).
    - Provenance widened only through an explicit closed set of two exact
      contracts; the captured path additionally requires an intact companion
      capture-authority verdict. No provider allowlist, no caller "real" flag.
  unchanged:
    - Bybit REST source_id a337be59-2019-5458-bc17-dd33750fa359 and contract
      hash a48f8dd5...8929 are byte-for-byte unchanged, as are existing REST
      provenance content hashes and evidence ids (pinned in tests).
  not_authorized_by_this_phase:
    - No paid subscription, no credentials, no acquisition of the 150 days.
    - No migration, no dataset, no execution/paper/live authority.
    - >-
      The blocker above stays UNRESOLVED. It needs acquired, sealed,
      provenance-proven, materialized full-span evidence with distinct
      historical decision times. Free samples are not a substitute.

safety_gates:
  - Untouched holdout (>= 2026-08-20T00:00Z) not opened, evaluated or summarized;
    the pilot itself fails closed on evidence reaching it.
  - >-
    Existing REST dataset is NOT deprecated or mutated. It stays
    provider-asserted evidence as of acquisition, valid for cross-checking and
    descriptive research, insufficient for decision-time reconstruction.
  - No migration, no provider/broker/account/order call, no paid activation,
    no execution-authority change, no live trading.
