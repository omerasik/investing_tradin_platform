# Cheap current-task pointer for Claude Code. Keep it under ~60 lines.
# This is NOT a second roadmap: requirements stay in MASTER_ROADMAP.md, design
# stays in module docstrings, history stays in git.

updated: 2026-09-22

# Recent commits number phases 3B.1/3B.2/3B.3/3C/3D.x. That series is distinct from
# docs/MODULE_3B_GOVERNANCE_SECURITY.md, docs/MODULE_3C_POSTGRES_RUNTIME_WIRING.md
# and from the roadmap's 3G/3H/3I/3J series. Disambiguate before assuming.
phase:
  id: "3D.9A"
  name: Real professional-validation preregistration packet
  status: in_review          # PR open, owner review; do NOT auto-merge
  base_commit: abd5068       # 3D.8C (PR #141) merged, exact-main CI green

# Why this phase exists: the first REAL invocation of
# OpenToOpenProfessionalValidationRequestV1 over the 150-day composite
# f07ebfc1-19ce-4757-af4b-10525f6a6992 must have every methodology input frozen,
# hashed and owner-authorized BEFORE the untouched holdout is opened. This phase
# is methodology only: no holdout evidence is read, evaluated or summarized.

scope:
  - src/trade_platform/open_to_open_preregistration_v1.py
  - tests/test_open_to_open_preregistration_v1.py

derived_span:                # mechanical, from the dataset's own 1m OHLCV bars
  evaluation: "[2026-04-22T00:00Z, 2026-09-19T00:00Z)"
  holdout_start: 2026-08-20T00:00:00Z   # raw boundary already UTC midnight
  pre_holdout_complete_days: 120
  holdout_complete_days: 30

acceptance:
  - Every owner-decided input is optional and absent by default; a packet with a
    gap is DRAFT/NOT_AUTHORIZED_FOR_HOLDOUT and names each gap. Nothing is
    defaulted, inferred, or copied from a unit-test constant.
  - An absent LiquidityCapacityPolicyV1 is NOT a gap: the canonical capacity path
    answers BLOCKED/MISSING_AUTHORIZED_CAPACITY_POLICY and research continues.
  - require_authorized_for_holdout() is the single gate on holdout evidence.
  - Deterministic content hash over all bound inputs; no table, no migration.

open_owner_decisions:        # 3D.9B cannot start until these are authorized
  - CryptoBasisMeanReversionDefinitionV1 threshold / horizon / exposure
  - CostModel components + cost_model_version (none authorized anywhere in src/)
  - walk-forward protocol days, neighbor steps, seeds/counts, stress magnitudes
  - BLOCKER: all 216,000 canonical basis materializations share ONE knowledge_at/
    computed_at, so every decision_at collapses to a single post-span instant and
    any run would admit zero decisions. Per-event knowledge time must be resolved
    before 3D.9B is meaningful.

safety_gates:
  - Untouched holdout (>= 2026-08-20T00:00Z) not opened, evaluated or summarized.
  - No migration, no provider/broker/account/order call, no capacity policy,
    no execution-authority change, no live trading.

validation:
  iterate: python -m unittest tests.test_open_to_open_preregistration_v1
  adjacent: open_to_open_validation_orchestration_v1, real_market_data_provenance_v1
  before_done: ruff check src tests migrations scripts && python scripts/check_mypy_baseline.py && bandit -q -r src/trade_platform
  ci_owns: full suite, Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
