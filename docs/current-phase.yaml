r0_operations:                # the T4 clock; runs beside every phase
  status: running             # BTCUSDT production contract v1, default root
  command: scripts/capture_bybit_public.py run   # `supervise` is available since R1A merged
  host_clock_finding: >-
    2026-09-24: Windows Time service (W32Time) is not running on the capture
    host and the host clock read ~9.47 s behind Bybit server time (RTT-bounded,
    +/- 0.18 s). Arrival timestamps are recorded on this clock. R1A records
    RTT-bounded offset samples in every session's lifecycle log as evidence;
    no arrival is ever adjusted. Enabling time sync is an owner action (system
    setting). Sessions recorded before sync carry this offset and R2A/R3A must
    decide their admissibility from the recorded evidence.
  timestamp_delta_rule: >-
    arrival - exchange ts is an OBSERVED TIMESTAMP DELTA, never latency, and is
    never the justification for a T2 publication-lag value (OR-5).

owner_decision:               # PERMANENT. Not a budget pause.
  id: NO_PAID_MARKET_DATA_SUBSCRIPTIONS
  date: 2026-09-23
  statement: >-
    No Tardis or other paid historical market-data subscription, now or later.
    Recurring market-data cost target is $0: official public exchange APIs and
    WebSocket feeds, free public exchange archives, official government and
    open-data sources, genuinely free APIs, and first-party capture. The dormant
    Tardis contract (b4f161e8-...) stays merged and unchanged, a dependency of
    nothing. No evidence standard is lowered.

blocker:                      # unchanged; resolved structurally by R2A + R3A/R3B
  id: UNPROVEN_DISTINCT_FEATURE_DECISION_TIMES
  root_cause: >-
    Feature knowledge_at = max(normalized_at, dataset.created_at) (platform
    ingestion/seal time, not market knowability), and canonical decision time
    includes computed_at. All 216,000 basis materializations of the T1
    composite f07ebfc1-19ce-4757-af4b-10525f6a6992 share one knowledge_at.
  resolution_path: R2A three-clock doctrine, then T4 (R3A) / T2 (R3B) evidence.

evidence_tiers:               # implemented by 3Z.1, evidence_tier_authority_v1.py
  T0_SYNTHETIC: engineering only.
  T1_RETROSPECTIVE: real values, no defensible knowledge time; no performance claims.
  T2_EVENT_TIME: venue event times; conditional only, with a declared bound lag.
  T3_PUBLICATION_TIME: publisher's own knowledge time (EDGAR, ALFRED, ...).
  T4_FIRST_PARTY_CAPTURE: our own recorder arrival times; grows forward only.
  gate_binding: professional validation stays bound to T3/T4 only.

existing_rest_dataset: >-
  f07ebfc1-19ce-4757-af4b-10525f6a6992 -- KEEP, T1_RETROSPECTIVE, cross-check
  and descriptive research only.

safety_gates:
  - Untouched holdout (>= 2026-08-20T00:00Z) not opened, evaluated or summarized.
  - No provider/broker/account/order call beyond public market data, no paid
    activation, no execution-authority change, no live trading.
  - Research evidence never becomes execution authority.
