# Phase naming. Since 2026-09-24 the owner-approved canonical roadmap uses an
# "R" series (R0-R15, owner review points OR-1..OR-14). It is distinct from the
# RQ-xxx rows, the 3B.x/3C/3D.x/3Z.x series, the MODULE_* docs and the roadmap's
# 3G/3H/3I/3J series. Order: R0 (ops) -> R1A -> OR-2 -> R1B; R2A (knowledge-time
# semantics, FIN) -> R2B (columnar data plane, SCALE) -> R3B (free T2 archive)
# -> R3A (T4 normalization/sealing) -> R4 Strategy Lab -> R5 UI -> R6 validation
# -> R8 opportunity engine -> R9 accounts/risk -> R10 paper; R7 (T3 spine) is
# the one parallel track.
phase:
  id: "R2B"
  name: Columnar research data plane (SCALE)
  status: in_progress
  base_commit: 97c55dd       # R2A.2 (PR #150) merged; R2A complete, exact-main CI green
  stack: >-
    pyarrow (Parquet, exact Arrow schema, decimal128(38,18), timestamp[us,UTC],
    byte-deterministic writer) + duckdb (query plane: filters, joins, ranking,
    exact decimal sums). Economic arithmetic stays Python Decimal: DuckDB and
    Polars turn DECIMAL/DECIMAL into binary float (DuckDB returns DOUBLE and
    rounds half away from zero); measured, and the evidence for OR-3.
  delivered: >-
    research_data_plane_v1.py (content-addressed objects + manifests,
    library-independent logical content hash, per-object sha256, streaming
    bounded-memory writer, verify), research_data_export_v1.py (sealed dataset
    -> REFERENCE_PRICE/OHLCV/OPEN_INTEREST frames, independent PostgreSQL
    reconciliation digest, basis feature frame with deterministic cache key,
    Feature Authority parity, research_frame_manifests catalog, migration
    0050), scripts/research_data_plane.py (export/verify/bench), analytics
    extra (never in runtime images).
  real_export_evidence: >-
    Composite f07ebfc1 (T1): 691,200 rows exported in ~34 s (~20k rows/s incl.
    PostgreSQL read), 43.2 MB Parquet (reference 54.6 B/row, OHLCV 79.4 B/row,
    OI 56.0 B/row), all three frames reconciled with PostgreSQL, repeat export
    byte-identical manifests, basis frame 216,000 rows = V2 materializations
    with 0 mismatches (cache hit on rebuild), peak working set ~513 MiB.
    Synthetic streaming bench: 1M rows 349 MiB peak, 6M rows 411 MiB peak
    (bounded), ~37k rows/s write and verify (Python-side validation/hashing is
    the known throughput limit). market_knowledge_at NULL in every T1 row.
  scope_paths:
    - src/trade_platform/research_data_plane_v1.py
    - src/trade_platform/research_data_export_v1.py
    - scripts/research_data_plane.py
    - migrations/versions/20260924_0050_research_frame_manifests.py
    - tests/test_research_data_plane_v1.py
    - tests/test_research_data_plane_postgres.py
  not_in_scope: >-
    Any evidence-tier change (the T1 composite stays T1, blocker not cleared),
    float/vectorized candidate search (OR-3), Strategy Lab (R4), T2/T4 frames
    (R3B/R3A reuse this plane).

