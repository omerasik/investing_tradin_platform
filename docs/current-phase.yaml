  root_cause: >-
    Feature knowledge_at = max(normalized_at, dataset.created_at) (platform
    ingestion/seal time, not market knowability), and canonical decision time
    includes computed_at. All 216,000 basis materializations of the T1
    composite f07ebfc1-19ce-4757-af4b-10525f6a6992 share one knowledge_at.
  resolution_path: R2A three-clock doctrine, then T4 (R3A) / T2 (R3B) evidence.
  scope_of_clearance: >-
    Cleared only per sealed T4 dataset where V3 rows prove >=2 distinct
    PROFESSIONAL decision times; never globally, never for f07ebfc1.

evidence_tiers:               # implemented by 3Z.1, evidence_tier_authority_v1.py
  T0_SYNTHETIC: engineering only.
  T1_RETROSPECTIVE: real values, no defensible knowledge time; no performance claims.
  T2_EVENT_TIME: venue event times; conditional only, with a declared bound lag.
  T3_PUBLICATION_TIME: publisher's own knowledge time (EDGAR, ALFRED, ...).
  T4_FIRST_PARTY_CAPTURE: our own recorder arrival times; grows forward only.
  gate_binding: professional validation stays bound to T3/T4 only.

