# Cheap current-task pointer for Claude Code. Keep it under ~60 lines.
# This is NOT a second roadmap: requirements stay in MASTER_ROADMAP.md, design
# stays in module docstrings, history stays in git.

updated: 2026-09-20

# Recent commits number phases 3B.1/3B.2/3B.3/3C/3D.x. That series is distinct from
# docs/MODULE_3B_GOVERNANCE_SECURITY.md, docs/MODULE_3C_POSTGRES_RUNTIME_WIRING.md
# and from the roadmap's 3G/3H/3I/3J series. Disambiguate before assuming.
phase:
  id: "3D.3"
  name: Canonical multi-day research dataset composition
  status: in_review          # PR open, unmerged
  base_commit: 6f9b98e

next:
  status: not_declared
  rule: >-
    No next module is authorized. Do not begin one. If asked for "the next
    phase", stop and ask the owner to declare its scope first.

scope:
  - src/trade_platform/historical_dataset_composition_v1.py
  - src/trade_platform/historical_acquisition.py   # only the two public expected_* wrappers
  - tests/test_historical_dataset_composition_v1.py
  - tests/test_historical_dataset_composition_v1_postgres.py

# The module docstring in historical_dataset_composition_v1.py is the
# authoritative design record. These are the invariants a change must not break.
acceptance:
  - Composition consumes only the exact historical_dataset_members of explicitly
    authorized SEALED parents; never a source-wide observation scan.
  - Every parent is proven (declared id + content hash, then the Phase 3B.1
    sealed_dataset_matches_request) before anything is written.
  - The target version is a pure function of the composition identity; sealing goes
    through PostgresHistoricalMarketDataPipeline.seal_dataset only.
  - Replay of an exactly matching target returns it without resealing; any other
    dataset at the target version is a fail-closed conflict.
  - Features are recomputed on the composed dataset, never copied from a parent.
  - The single-dataset research/capacity binding is not relaxed.

safety_gates:
  - No provider, broker or account call; no live trading; no capacity policy.
  - No scheduling, no OperationalJobPolicy change, no migration.
  - Never touch the real trade_platform_research database in development or tests;
    the real seven-day composition happens only after review, merge and green
    exact-main CI.

validation:
  iterate: python -m unittest tests.test_historical_dataset_composition_v1
  before_done: ruff check src tests migrations scripts && python -m unittest discover -s tests
  postgres: requires POSTGRES_TEST_DSN; without it 185 tests skip and the suite still says OK
  ci_owns: Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
