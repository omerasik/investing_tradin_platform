# Cheap current-task pointer for Claude Code. Keep it under ~60 lines.
# This is NOT a second roadmap: requirements stay in MASTER_ROADMAP.md, design
# stays in module docstrings, history stays in git.

updated: 2026-09-22

# Recent commits number phases 3B.1/3B.2/3B.3/3C/3D.x. That series is distinct from
# docs/MODULE_3B_GOVERNANCE_SECURITY.md, docs/MODULE_3C_POSTGRES_RUNTIME_WIRING.md
# and from the roadmap's 3G/3H/3I/3J series. Disambiguate before assuming.
phase:
  id: "3D.8C"
  name: Canonical real-data provenance on operator surfaces
  status: in_review          # PR open, owner review; do NOT auto-merge
  base_commit: 53791f0       # 3D.8A (PR #140) merged, exact-main CI green

# Why this phase exists: 3D.8A added the canonical provenance authority, but the
# operator dashboard could only classify through the (empty) legacy free-text
# provider allowlist, so the real 150-day composite f07ebfc1-... never showed real.

scope:
  - src/trade_platform/operator_dashboard.py
  - web/app/operator-contracts.ts
  - web/app/(protected)/markets/page.tsx
  - tests/test_operator_dashboard_real_data_provenance.py
  - tests/test_operator_dashboard_real_data_provenance_postgres.py

acceptance:
  - Historical-dataset and data-health surfaces (exact historical_dataset_versions id)
    classify only via PostgresRealMarketDataProvenanceAuthorityV1; synthetic markers win.
  - Legacy surfaces (strategies, experiments, scorecards, validation packages, signals)
    reach only legacy dataset_versions: no authoritative bridge, stay fail-closed.
  - _AUTHORIZED_REAL_MARKET_DATA_PROVIDERS stays empty; provider text never grants real.
  - Each distinct dataset id is proven once per request; no cache table, no migration.

safety_gates:
  - Read-only; no migration, no provider/broker/account/order call, no capacity
    policy, no execution-authority change.

validation:
  iterate: python -m unittest tests.test_operator_dashboard_real_data_provenance
  adjacent: operator_dashboard *_postgres, classify-research-evidence, 3D.8A provenance
  before_done: ruff check src tests migrations scripts && python scripts/check_mypy_baseline.py && bandit -q -r src/trade_platform
  ci_owns: full suite, Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
