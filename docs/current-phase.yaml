r0_operations:                # the T4 clock; runs beside every phase
  status: running             # BTCUSDT production contract v1, default root
  command: scripts/capture_bybit_public.py run   # `supervise` is available since R1A merged
  host_clock_finding: >-
    2026-09-24: Windows Time service (W32Time) is not running on the capture
    host and the host clock read ~9.47 s behind Bybit server time (RTT-bounded,
    +/- 0.18 s). Arrival timestamps are recorded on this clock. R1A records
    RTT-bounded offset samples in every session's lifecycle log as evidence;
    no arrival is ever adjusted. Enabling time sync is an owner action (system
    setting). Sessions recorded before sync carry this offset and R2A/R3A must
    decide their admissibility from the recorded evidence.
  timestamp_delta_rule: >-
    arrival - exchange ts is an OBSERVED TIMESTAMP DELTA, never latency, and is
    never the justification for a T2 publication-lag value (OR-5).

