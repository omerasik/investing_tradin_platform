# The module docstring in scheduled_historical_acquisition_v1.py is the
# authoritative design record. These are the invariants a change must not break.
acceptance:
  - Two independent gates (composed authorization AND an enabled, operator-approved
    OperationalJobPolicy at the exact job_policy_version) are both required before
    any provider call. Neither gate alone enables execution.
  - Windows are fixed UTC slots derived from anchor + k*window_size, never
    "last run + interval". Eligibility is a pure function of authorization and as_of.
  - Window completion is proven by sealed-dataset identity
    (sealed_dataset_matches_request), never by a version name, cursor or watermark.
  - Catch-up is oldest-first, bounded per invocation, and stops at the first failed
    or contended window; a newer window is never acquired past an older gap.
  - Each window is guarded by a PostgreSQL session advisory lock bound to the
    authorization identity and the exact window.
  - Absent configuration means no runner exists, so worker_app stays
    provider-network-inert.

safety_gates:
  - Public Bybit V5 market data only. Public v1 requires secret_reference is None.
  - Provider terms acceptance stays explicit on ProviderConfiguration and is never
    flipped in code.
  - No broker/account API, no order placement, no paid data, no real funds.
  - Do not make outbound provider calls during development; tests are fixture-driven.

validation:
  iterate: python -m unittest tests.test_scheduled_historical_acquisition_v1
  before_done: ruff check src tests migrations scripts && python -m unittest discover -s tests
  postgres: requires POSTGRES_TEST_DSN; without it 185 tests skip and the suite still says OK
  ci_owns: Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
