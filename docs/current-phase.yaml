updated: 2026-09-21

# Recent commits number phases 3B.1/3B.2/3B.3/3C/3D.x. That series is distinct from
# docs/MODULE_3B_GOVERNANCE_SECURITY.md, docs/MODULE_3C_POSTGRES_RUNTIME_WIRING.md
# and from the roadmap's 3G/3H/3I/3J series. Disambiguate before assuming.
phase:
  id: "3D.7R.1"
  name: Scalable canonical dataset sealing
  status: in_review          # PR open
  base_commit: c89b561

# Why this phase exists: 3D.6R.1 (Bybit retCode 10006 bounded retry) merged, and the
# 3D.6R.x recoveries sealed all 150 real daily datasets for [2026-04-22, 2026-09-19).
# Composing them (Phase 3D.7, 691,200 members) failed closed before any write:
# seal_dataset() bound one SQL placeholder per member, above PostgreSQL's 65,535
# bind-parameter limit.

next:
  id: "3D.7"
  name: Canonical real 150-day composite over [2026-04-22, 2026-09-19)
  rule: >-
    Operational only, after this PR is merged and exact-main CI is green. No
    provider call. Expected content hash (derived read-only from the frozen
    parents): cfd0f8fe940fe40a631fa2370956370808f0d8dd036b58841578e7335d902b30.

scope:
  - src/trade_platform/historical_market_data.py
  - tests/test_historical_dataset_sealing_scale_postgres.py

acceptance:
  - No seal_dataset() statement carries one bind parameter per member; the member
    set travels as a single uuid[] parameter for both the proof read and the insert.
  - Content hash is byte-identical to the pre-3D.7R.1 algorithm for identical inputs,
    independent of member input order; no new hash version.
  - Every fail-closed check (missing, source, normalization version, rejected,
    availability, duplicates) raises the same error and writes nothing.
  - A dataset above 65,535 members seals with its exact member set persisted.

safety_gates:
  - No schema migration, no provider call, no broker/account/order call.
  - No change to composition semantics, dataset identities or content-hash inputs.

validation:
  iterate: python -m unittest tests.test_historical_dataset_sealing_scale_postgres
  adjacent: every tests/*_postgres.py module that calls seal_dataset, on a fresh DB
  before_done: ruff check src tests migrations scripts && python scripts/check_mypy_baseline.py
  ci_owns: full suite, Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
