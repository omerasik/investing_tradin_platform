# Cheap current-task pointer for Claude Code. Keep it under ~60 lines.
# This is NOT a second roadmap: requirements stay in MASTER_ROADMAP.md, design
# stays in module docstrings, history stays in git.

updated: 2026-09-21

# Recent commits number phases 3B.1/3B.2/3B.3/3C/3D.x. That series is distinct from
# docs/MODULE_3B_GOVERNANCE_SECURITY.md, docs/MODULE_3C_POSTGRES_RUNTIME_WIRING.md
# and from the roadmap's 3G/3H/3I/3J series. Disambiguate before assuming.
phase:
  id: "3D.6R.1"
  name: Bybit V5 provider-rate-limit recovery semantics
  status: in_review          # PR open, unmerged
  base_commit: 0daed0e

# Why this phase exists: the Phase 3D.6 validation-horizon backfill sealed 8 daily
# windows (2026-04-22 -> 2026-04-30) and then failed closed on the next window with
# bybit_provider_error:10006 under HTTP 200. No evidence was corrupted. The adapter
# retried transport/status failures but treated every non-zero envelope retCode as an
# immediate ProviderError, so a documented transient rate limit was unrecoverable.

next:
  status: declared_not_authorized
  id: "3D.6R.2"
  name: Controlled recovery of the remaining 135 windows
  rule: >-
    Do not begin it. The recovery operation runs only after this PR is reviewed,
    merged and green on exact-main CI, and only under a fresh owner authorization.

scope:
  - src/trade_platform/bybit_crypto_provider.py
  - tests/test_bybit_crypto_provider.py

acceptance:
  - Exactly retCode 10006 on HTTP 200 is a retryable provider-rate-limit condition;
    every other non-zero retCode still fails on the attempt that saw it.
  - RetryPolicy.maximum_attempts is the absolute attempt bound; there is no retry
    loop outside that single authority.
  - A valid, future, plausible X-Bapi-Limit-Reset-Timestamp drives the delay through
    the injected clock; absent/malformed/elapsed/distant values fall back to
    RetryPolicy exponential backoff. No negative sleep is representable.
  - The shared MinimumIntervalRequestPacer admits every outbound attempt, retries
    included. No second hidden rate limiter.
  - Exhaustion re-raises the canonical bybit_provider_error:10006 identity; never an
    empty page, stale data or success.
  - Malformed JSON and malformed envelopes stay fail-closed and are never retried.
  - HTTP-status retry semantics are unchanged.

safety_gates:
  - No live Bybit call, no credentials, no broker/account/order call, no live trading.
  - No scheduling, no OperationalJobPolicy change, no migration, no capacity policy.
  - Never touch the real trade_platform_research database; the recovery of the
    remaining windows is Phase 3D.6R.2, not this phase.

validation:
  iterate: python -m unittest tests.test_bybit_crypto_provider
  adjacent: python -m unittest tests.test_historical_acquisition tests.test_scheduled_historical_acquisition_v1 tests.test_provider_ingestion tests.test_data_providers
  before_done: ruff check src tests migrations scripts && python scripts/check_mypy_baseline.py
  ci_owns: full suite, Docker, Trivy, attestations, pip-audit, pg restore drill, staging Compose, next build, Playwright
