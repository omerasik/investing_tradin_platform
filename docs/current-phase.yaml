updated: 2026-09-23

# Recent commits number phases 3B.1/3B.2/3B.3/3C/3D.x. That series is distinct from
# docs/MODULE_3B_GOVERNANCE_SECURITY.md, docs/MODULE_3C_POSTGRES_RUNTIME_WIRING.md
# and from the roadmap's 3G/3H/3I/3J series. Disambiguate before assuming.
phase:
  id: "3D.9S.3A"
  name: Zero-cost market-data doctrine (owner decision recorded)
  status: decided_no_paid_market_data
  base_commit: 5a11527       # 3D.9S.2B (PR #144) merged, exact-main CI green

owner_decision:               # PERMANENT. Not a budget pause.
  id: NO_PAID_MARKET_DATA_SUBSCRIPTIONS
  date: 2026-09-23
  statement: >-
    The platform will not purchase Tardis or any other paid historical
    market-data subscription, now or later. Recurring market-data subscription
    cost target is $0. Acquisition uses official public exchange APIs and
    WebSocket feeds, free public exchange archives, official government and
    open-data sources, genuinely free APIs, and first-party capture performed
    by this platform.
  consequences:
    - The 3D.9S.3A acquisition/purchase gate is SUPERSEDED and will not be executed.
    - >-
      canonical_captured_source_authority_v1 (Tardis contract, source_id
      b4f161e8-3ebd-53f5-bfdb-e527f598b08a) stays merged and byte-for-byte
      unchanged as a never-activated authority. It is history and a reusable
      semantic reference; it is NOT a dependency of any future phase.
    - >-
      The valuable part of 3D.9S.2A/2B is CAPTURE semantics (recorder arrival
      clock, channel scope, generated-record refusal, OPEN vs completed-bar
      availability, positive coverage, fail-closed gaps) -- vendor-independent.
      First-party capture reuses it as a third contract of the same shape.
    - No evidence standard is lowered. The professional PIT gate is unchanged.

blocker:                      # unchanged; still an EVIDENCE-SOURCE problem
  id: UNPROVEN_DISTINCT_FEATURE_DECISION_TIMES
  consequence: >-
    All 216,000 canonical basis materializations share one knowledge_at, so
    every decision_at collapses to a single post-span instant and any
    open-to-open run would admit zero decisions.
  resolution_path: >-
    Not money. Either T2 event-time evidence with a declared publication-lag
    assumption (conditional results only), or T3/T4 evidence that carries a
    real per-observation knowledge time. See evidence_tiers.

# Proposed by 3D.9S.3A; the authority module is Phase 3Z.1 work, not yet built.
# Orthogonal to real_market_data_provenance_v1 status, never a replacement for it.
evidence_tiers:
  T0_SYNTHETIC:      engineering only; no economic claim of any kind.
  T1_RETROSPECTIVE: >-
    Real values, no defensible knowledge time. Permits descriptive statistics,
    data-quality work, liquidity/cost envelopes, hypothesis GENERATION, engine
    correctness. Forbids performance, parameter ranking, any "works" claim.
  T2_EVENT_TIME: >-
    Venue-published per-observation event timestamps (free exchange tick
    archives). Distinct decision times are provable; dissemination latency is
    NOT. Permits backtests only under an explicit preregistered publication-lag
    assumption plus lag sensitivity. Never a professional verdict.
  T3_PUBLICATION_TIME: >-
    The source itself publishes the knowledge time. Genuine PIT at $0 today:
    SEC EDGAR acceptanceDateTime, FRED/ALFRED vintage dates, ECB and CME
    scheduled publication times. Professional-verdict eligible.
  T4_FIRST_PARTY_CAPTURE: >-
    Our own recorder arrival timestamps on official public WebSocket feeds.
    Strongest; grows forward only. Professional-verdict eligible.
  gate_binding: >-
    open_to_open professional validation stays bound to T3/T4 ONLY. T1/T2 live
    in a separately named research lane that can never emit a professional
    verdict, and must never be presented as PIT validation.

existing_rest_dataset:        # f07ebfc1-19ce-4757-af4b-10525f6a6992
  action: KEEP. Not deleted, not deprecated, not mutated, not relabelled.
  tier: T1_RETROSPECTIVE      # effective_at = computed bar_close_at is an assumption
  continuing_role: >-
    Cross-check reference and descriptive research, exactly as already declared.
    The same instrument and span are covered by the free Bybit public tick
    archive (public.bybit.com/trading/BTCUSDT/, daily csv.gz from 2020-03-25),
    which can raise the SAME research question to T2 over 6+ years at $0.

next_phases:                  # boundaries only; none authorized to start here
  3Z.1: >-
    Evidence-tier authority + doctrine. Content-hashed tier verdicts; bind the
    professional gate to T3/T4; supersede the acquisition gate. IMPLEMENT NEXT.
  3Z.2: >-
    First-party forward capture recorder (official public Bybit/Binance WS):
    immutable raw NDJSON, UTC-day partitions, manifests/checksums, reconnect and
    gap detection, resumability, replay. Value is time-dependent -- start early.
  3Z.3: Free exchange archive acquisition (T2) for BTCUSDT; replaces the purchase.
  3Z.4: Publication-time macro/fundamental spine (T3) -- ALFRED + SEC EDGAR.
  3Z.5: First professional validation run, on T3 evidence.

safety_gates:
  - Untouched holdout (>= 2026-08-20T00:00Z) not opened, evaluated or summarized.
  - No migration, no provider/broker/account/order call, no paid activation,
    no execution-authority change, no live trading.
  - Research evidence never becomes execution authority.
