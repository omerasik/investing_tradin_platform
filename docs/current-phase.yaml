or_packet_evidence:           # facts only; every decision stays with the owner
  or1_refetch: >-
    2026-10-03: BTCUSDT archive days 2026-09-21..24 re-downloaded 9-11 days
    after first acquisition: 4/4 byte-identical (size, sha256, Last-Modified).
    2026-10-06: 09-21 (15 days later) and 10-02 byte-identical again. HEAD census
    (no bodies): BTCUSDT 2,386/2,386 days 2020-03-25..2026-10-05 = 85.08 GiB
    (last 365 d 25.6 GiB); 8 measured symbols last 365 d = 76.6 GiB. ETags are
    multipart (not content MD5). Files before ~2020-10 carry Last-Modified in
    Aug-Oct 2020: the publisher has rewritten history at least once (a re-fetch
    detects a rewrite, it cannot recover the old bytes). T2 trade Parquet is
    0.90x the gzip archive (3-day sample 259 vs 289 MB); 1m bars ~0.13 MB/day.
    On disk: production capture 1.98 GB (1.91 GB raw PARTIAL/open), measurement
    7.46 GB, research DB 2.0 GB; free 39.5 GiB vs 20 GiB recorder floor.
  or3_numeric: >-
    T0 synthetic tick-grid sweep (no dates, no holdout), 68 causal candidates
    (48 SMA-cross + 20 ratio-breakout). 200k bars: Polars float64 0.68-0.95 s,
    Python float 5.0 s, Decimal 16.1 s (exact-integer) / 24.1 s (naive), peak
    WS 290/152/155/168 MB; 1M bars: Polars 2.6 s vs Decimal 90.9 s. Ranking
    Spearman = Kendall = 1.0, top-10 identical; float misses exact SMA ties
    (1 bar per 200k, 4 per 1M, 1 trade each). Exact ratio-boundary probe:
    float says below threshold for ~60 % of exact ties at r = 0.001/0.003/0.005
    (0 % at 0.002/0.01). All modes byte-deterministic on rerun.
    2026-10-06 Strategy-Lab-shaped sweep (T0, 48 candidates: 16 SMA-cross,
    20 k-bar momentum +/-threshold, 12 vol-gated momentum; gross cost-free
    metrics): 1M bars Polars float64 5.4 s / 668 MB vs Decimal(prec 50) 132.4 s /
    1,062 MB; float rerun byte-identical. Spearman(total) 1.0, top-1/5/10
    identical, Kendall 0.957 (float noise orders exact metric ties). 16/48
    candidates diverge in signals (max 47 bars, 45 trades, 2 % rel. metric),
    all at exact Decimal ties, all caught by a 1e-9 near-tie flag (16/16; 12/12
    at 200k, 4/4 at 20k); identical signals -> metric error <= 8.8e-14.
    Option A top-10 Decimal re-run 19.3 s; top-10 + all 31 tie-flagged 110.5 s.
    Exact-tie probe: 'a/b - 1 > th' never reports equality on exact ties
    (below for 56-85 % at 0.0005/0.001/0.0025/0.003/0.005, above for 100 % at
    0.002/0.01/0.02); algebraically equal float forms disagree with each other.
