name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trade_platform
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trade_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/trade_platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests migrations scripts
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - name: PostgreSQL backup, fresh restore and reconciliation drill
        env:
          RESTORED_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/trade_platform_restore
        run: |
          pg_dump "$POSTGRES_TEST_DSN" --format=custom --file=/tmp/trade-platform.dump
          head -c 1024 /tmp/trade-platform.dump > /tmp/trade-platform-corrupt.dump
          if pg_restore --list /tmp/trade-platform-corrupt.dump >/dev/null 2>&1; then
            echo "corrupt backup was unexpectedly accepted"
            exit 1
          fi
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE trade_platform_restore"
          pg_restore --no-owner --no-privileges --dbname="$RESTORED_POSTGRES_DSN" /tmp/trade-platform.dump
          python scripts/verify_postgres_restore.py --source-dsn "$POSTGRES_TEST_DSN" --restored-dsn "$RESTORED_POSTGRES_DSN"
      - run: ruff check src tests migrations scripts
      - name: Complete-package mypy regression ratchet
        run: python scripts/check_mypy_baseline.py
      - run: mypy --follow-imports=skip src/trade_platform/persistence.py src/trade_platform/postgres_schema.py src/trade_platform/postgres_backfill.py src/trade_platform/legacy_migration_fixture.py src/trade_platform/postgres_repositories.py src/trade_platform/postgres_runtime.py src/trade_platform/postgres_recovery.py src/trade_platform/postgres_pretrade.py src/trade_platform/postgres_market_context.py src/trade_platform/postgres_decision_authorities.py src/trade_platform/professional_instruments.py src/trade_platform/historical_market_data.py src/trade_platform/data_health.py src/trade_platform/pit_fundamentals.py src/trade_platform/pit_macro.py src/trade_platform/feature_authority.py src/trade_platform/trend_strategy_v2.py src/trade_platform/trend_research_v2.py src/trade_platform/investment_engine_v2.py src/trade_platform/regime_engine_v2.py src/trade_platform/portfolio_construction_v2.py src/trade_platform/news_event_intelligence.py src/trade_platform/observability_sre_v2.py src/trade_platform/postgres_quant_validation.py src/trade_platform/strategy_scorecard_v2.py scripts/verify_postgres_restore.py
      - run: bandit -q -r src/trade_platform
      - name: Audit resolved Python dependencies
        run: |
          python -m pip freeze --exclude-editable > /tmp/resolved-requirements.txt
          pip-audit --strict -r /tmp/resolved-requirements.txt
      - run: cyclonedx-py environment --output-file sbom-python.json
      - name: Scan tracked source and configuration for credential patterns and entropy
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files -- . ':!.secrets.baseline')
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm audit --prod --audit-level high
        working-directory: web
      - name: Record frontend production dependency licenses
        run: pnpm licenses list --prod --json > frontend-licenses.json
        working-directory: web
      - run: pnpm exec next build
        working-directory: web
      - name: Verify built dashboard and fail-closed risk proxy
        working-directory: web
        run: |
          pnpm exec next start -p 3000 > /tmp/dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill $dashboard_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ && break
            sleep 1
          done
          DASHBOARD_URL=http://127.0.0.1:3000 node scripts/verify-dashboard.mjs
      - name: Retain dependency and licensing evidence
        uses: actions/upload-artifact@v7
        with:
          name: dependency-evidence
          path: |
            sbom-python.json
            web/frontend-licenses.json
