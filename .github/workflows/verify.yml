name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trade_platform
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trade_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/trade_platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests migrations scripts
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - name: PostgreSQL backup, fresh restore and reconciliation drill
        env:
          RESTORED_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/trade_platform_restore
        run: |
          pg_dump "$POSTGRES_TEST_DSN" --format=custom --file=/tmp/trade-platform.dump
          head -c 1024 /tmp/trade-platform.dump > /tmp/trade-platform-corrupt.dump
          if pg_restore --list /tmp/trade-platform-corrupt.dump >/dev/null 2>&1; then
            echo "corrupt backup was unexpectedly accepted"
            exit 1
          fi
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE trade_platform_restore"
          pg_restore --no-owner --no-privileges --dbname="$RESTORED_POSTGRES_DSN" /tmp/trade-platform.dump
          python scripts/verify_postgres_restore.py --source-dsn "$POSTGRES_TEST_DSN" --restored-dsn "$RESTORED_POSTGRES_DSN"
      - run: ruff check src tests migrations scripts
      - name: Complete-package mypy regression ratchet
        run: python scripts/check_mypy_baseline.py
      - run: mypy --follow-imports=skip src/trade_platform/persistence.py src/trade_platform/postgres_schema.py src/trade_platform/postgres_backfill.py src/trade_platform/legacy_migration_fixture.py src/trade_platform/postgres_repositories.py src/trade_platform/postgres_runtime.py src/trade_platform/postgres_recovery.py src/trade_platform/postgres_pretrade.py src/trade_platform/postgres_market_context.py src/trade_platform/postgres_decision_authorities.py src/trade_platform/professional_instruments.py src/trade_platform/historical_market_data.py src/trade_platform/data_health.py src/trade_platform/pit_fundamentals.py src/trade_platform/pit_macro.py src/trade_platform/feature_authority.py src/trade_platform/trend_strategy_v2.py src/trade_platform/trend_research_v2.py src/trade_platform/investment_engine_v2.py src/trade_platform/regime_engine_v2.py src/trade_platform/portfolio_construction_v2.py src/trade_platform/news_event_intelligence.py src/trade_platform/social_narrative_intelligence.py src/trade_platform/signal_engine.py src/trade_platform/risk.py src/trade_platform/policy_registry.py src/trade_platform/pretrade_assessment.py src/trade_platform/paper_runtime.py src/trade_platform/operational_alerts.py src/trade_platform/execution_quality.py src/trade_platform/operational_jobs.py src/trade_platform/retention_evidence.py src/trade_platform/security.py src/trade_platform/external_identity.py src/trade_platform/model_evaluation.py src/trade_platform/model_monitoring_evidence.py src/trade_platform/governance_reporting.py src/trade_platform/research_retrieval.py src/trade_platform/agent_answer_evaluation.py src/trade_platform/scheduled_agent_workflows.py src/trade_platform/model_historical_analogues.py src/trade_platform/observability_sre_v2.py src/trade_platform/postgres_quant_validation.py src/trade_platform/strategy_scorecard_v2.py src/trade_platform/operator_dashboard.py scripts/verify_postgres_restore.py scripts/serve_postgres_dashboard_evidence.py
      - run: bandit -q -r src/trade_platform
      - name: Audit resolved Python dependencies
        run: |
          python -m pip freeze --exclude-editable > /tmp/resolved-requirements.txt
          pip-audit --strict -r /tmp/resolved-requirements.txt
      - run: cyclonedx-py environment --output-file sbom-python.json
      - name: Scan tracked source and configuration for credential patterns and entropy
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files -- . ':!.secrets.baseline')
      - name: Build and verify hardened non-root research API container
        run: |
          image_ref="trade-platform-research:${GITHUB_SHA}"
          docker build --tag "$image_ref" .
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$image_ref")"
          test "$configured_user" = "10001:10001"
          container_id="$(docker run --rm --detach \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:8767:8000 \
            --env TRADE_PLATFORM_OPERATOR_TOKEN=container-role-token \
            --env TRADE_PLATFORM_OPERATOR_ROLE=viewer \
            "$image_ref")"
          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8767/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          ready_payload="$(curl --fail --silent http://127.0.0.1:8767/health/ready)"
          READY_PAYLOAD="$ready_payload" python -c "import json, os; payload=json.loads(os.environ['READY_PAYLOAD']); assert payload['environment'] == 'local_research' and payload['paper_trading_enabled'] is True and payload['live_trading_enabled'] is False"
          test "$(docker exec "$container_id" id -u)" = "10001"
          unauthenticated_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8767/audit/events)"
          test "$unauthenticated_status" = "401"
          viewer_read_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Authorization: Bearer container-role-token' http://127.0.0.1:8767/audit/events)"
          test "$viewer_read_status" = "200"
          viewer_write_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Authorization: Bearer container-role-token' --header 'Content-Type: application/json' --data '{"event_type":"container.probe","actor":"ignored","payload":{}}' http://127.0.0.1:8767/audit/events)"
          test "$viewer_write_status" = "403"
      - name: Scan research API image and generate its SBOM
        run: |
          image_ref="trade-platform-research:${GITHUB_SHA}"
          scanner_ref="aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
          scan_input="$RUNNER_TEMP/trivy-input"
          scan_cache="$RUNNER_TEMP/trivy-cache"
          scan_output="$GITHUB_WORKSPACE/container-security-evidence"
          artifact_output="$GITHUB_WORKSPACE/container-artifact"
          mkdir -p "$scan_input" "$scan_cache" "$scan_output" "$artifact_output"
          docker save --output "$scan_input/research-api.tar" "$image_ref"
          scanner() {
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              --tmpfs /tmp:rw,noexec,nosuid,size=256m \
              --volume "$scan_input:/input:ro" \
              --volume "$scan_cache:/cache:rw" \
              --volume "$scan_output:/output:rw" \
              --env TRIVY_CACHE_DIR=/cache \
              "$scanner_ref" "$@"
          }
          scanner image \
            --input /input/research-api.tar \
            --scanners vuln \
            --exit-on-eol 1 \
            --format json \
            --output /output/vulnerability-report.json \
            --no-progress
          scanner image \
            --input /input/research-api.tar \
            --scanners vuln \
            --format cyclonedx \
            --output /output/sbom.cdx.json \
            --no-progress
          test -s "$scan_output/vulnerability-report.json"
          test -s "$scan_output/sbom.cdx.json"
          scanner image \
            --input /input/research-api.tar \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --exit-on-eol 1 \
            --no-progress
          gzip --best --stdout "$scan_input/research-api.tar" > "$artifact_output/research-api.tar.gz"
          (
            cd "$artifact_output"
            sha256sum research-api.tar.gz > research-api.tar.gz.sha256
          )
          test -s "$artifact_output/research-api.tar.gz"
          test -s "$artifact_output/research-api.tar.gz.sha256"
      - name: Attest research image archive provenance
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        id: image-provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: container-artifact/research-api.tar.gz
      - name: Attest research image archive SBOM
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        id: image-sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: container-artifact/research-api.tar.gz
          sbom-path: container-security-evidence/sbom.cdx.json
      - name: Retain and verify research image attestations
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.image-provenance.outputs.bundle-path }}" container-security-evidence/provenance-attestation.sigstore.json
          cp "${{ steps.image-sbom.outputs.bundle-path }}" container-security-evidence/sbom-attestation.sigstore.json
          test -s container-security-evidence/provenance-attestation.sigstore.json
          test -s container-security-evidence/sbom-attestation.sigstore.json
          gh attestation verify container-artifact/research-api.tar.gz \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify container-artifact/research-api.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm audit --audit-level high
        working-directory: web
      - name: Record frontend production dependency licenses
        run: pnpm licenses list --prod --json > frontend-licenses.json
        working-directory: web
      - run: pnpm exec next build
        working-directory: web
      - name: Verify built dashboard and fail-closed risk proxy
        working-directory: web
        env:
          TRADE_PLATFORM_DASHBOARD_VIEW_TOKEN: fixture-view-token
        run: |
          pnpm exec next start -p 3000 > /tmp/dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill $dashboard_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ && break
            sleep 1
          done
          DASHBOARD_URL=http://127.0.0.1:3000 node scripts/verify-dashboard.mjs
      - name: Cache Playwright browser binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: web
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: pnpm exec playwright install --only-shell chromium
      - name: Browser E2E against protected PostgreSQL authorities
        env:
          CYCLE208_DASHBOARD_CONFIG_PATH: /tmp/cycle208-dashboard.config.json
          CYCLE208_DASHBOARD_TOKEN_PATH: /tmp/cycle208-dashboard.token
          TRADE_PLATFORM_DASHBOARD_CONFIG_PATH: /tmp/cycle208-dashboard.config.json
          CYCLE208_API_URL: http://127.0.0.1:8766
          DASHBOARD_URL: http://127.0.0.1:3000
          TRADE_PLATFORM_DASHBOARD_VIEW_TOKEN: fixture-view-token
        run: |
          python scripts/serve_postgres_dashboard_evidence.py > /tmp/cycle208-api.log 2>&1 &
          api_pid=$!
          for attempt in {1..30}; do
            test -f "$CYCLE208_DASHBOARD_CONFIG_PATH" && curl --fail --silent http://127.0.0.1:8766/health/live && break
            sleep 1
          done
          test -f "$CYCLE208_DASHBOARD_CONFIG_PATH"
          curl --fail --silent http://127.0.0.1:8766/health/live >/dev/null
          cd web
          pnpm exec next start -p 3000 > /tmp/cycle208-dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill $dashboard_pid $api_pid 2>/dev/null || true; rm -f "$CYCLE208_DASHBOARD_CONFIG_PATH" "$CYCLE208_DASHBOARD_TOKEN_PATH"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent -H "Authorization: Bearer $TRADE_PLATFORM_DASHBOARD_VIEW_TOKEN" http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl --fail --silent -H "Authorization: Bearer $TRADE_PLATFORM_DASHBOARD_VIEW_TOKEN" http://127.0.0.1:3000/ >/dev/null
          pnpm test:e2e
      - name: Retain dependency and licensing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-evidence
          path: |
            sbom-python.json
            web/frontend-licenses.json
            container-security-evidence/vulnerability-report.json
            container-security-evidence/sbom.cdx.json
            container-security-evidence/provenance-attestation.sigstore.json
            container-security-evidence/sbom-attestation.sigstore.json
            container-artifact/research-api.tar.gz
            container-artifact/research-api.tar.gz.sha256
