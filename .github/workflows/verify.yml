name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec next build
        working-directory: web
      - name: Verify built dashboard and fail-closed risk proxy
        working-directory: web
        run: |
          pnpm exec next start -p 3000 > /tmp/dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill $dashboard_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ && break
            sleep 1
          done
          DASHBOARD_URL=http://127.0.0.1:3000 node scripts/verify-dashboard.mjs
