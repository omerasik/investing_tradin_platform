name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trade_platform
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trade_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/trade_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests migrations scripts
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - name: PostgreSQL backup, fresh restore and reconciliation drill
        env:
          RESTORED_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/trade_platform_restore
        run: |
          pg_dump "$POSTGRES_TEST_DSN" --format=custom --file=/tmp/trade-platform.dump
          head -c 1024 /tmp/trade-platform.dump > /tmp/trade-platform-corrupt.dump
          if pg_restore --list /tmp/trade-platform-corrupt.dump >/dev/null 2>&1; then
            echo "corrupt backup was unexpectedly accepted"
            exit 1
          fi
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE trade_platform_restore"
          pg_restore --no-owner --no-privileges --dbname="$RESTORED_POSTGRES_DSN" /tmp/trade-platform.dump
          python scripts/verify_postgres_restore.py --source-dsn "$POSTGRES_TEST_DSN" --restored-dsn "$RESTORED_POSTGRES_DSN"
      - run: ruff check src/trade_platform/persistence.py src/trade_platform/postgres_schema.py src/trade_platform/postgres_backfill.py src/trade_platform/legacy_migration_fixture.py src/trade_platform/postgres_repositories.py src/trade_platform/postgres_runtime.py src/trade_platform/postgres_recovery.py src/trade_platform/postgres_pretrade.py src/trade_platform/postgres_market_context.py src/trade_platform/postgres_decision_authorities.py scripts/verify_postgres_restore.py tests/test_persistence.py tests/test_postgres_backfill_integration.py tests/test_postgres_integration.py tests/test_postgres_runtime.py migrations/versions/20260815_0004_postgres_pretrade_evidence.py migrations/versions/20260815_0005_postgres_market_context.py migrations/versions/20260815_0006_postgres_decision_authorities.py migrations/versions/20260815_0007_postgres_recovery_gate.py
      - run: mypy --follow-imports=skip src/trade_platform/persistence.py src/trade_platform/postgres_schema.py src/trade_platform/postgres_backfill.py src/trade_platform/legacy_migration_fixture.py src/trade_platform/postgres_repositories.py src/trade_platform/postgres_runtime.py src/trade_platform/postgres_recovery.py src/trade_platform/postgres_pretrade.py src/trade_platform/postgres_market_context.py src/trade_platform/postgres_decision_authorities.py scripts/verify_postgres_restore.py
      - run: bandit -q -r src/trade_platform/persistence.py src/trade_platform/postgres_backfill.py src/trade_platform/legacy_migration_fixture.py src/trade_platform/postgres_repositories.py src/trade_platform/postgres_runtime.py src/trade_platform/postgres_recovery.py src/trade_platform/postgres_pretrade.py src/trade_platform/postgres_market_context.py src/trade_platform/postgres_decision_authorities.py scripts/verify_postgres_restore.py
      - name: Audit resolved Python dependencies
        run: |
          python -m pip freeze --exclude-editable > /tmp/resolved-requirements.txt
          pip-audit --strict -r /tmp/resolved-requirements.txt
      - run: cyclonedx-py environment --output-file sbom.json
      - name: Fail on committed secret-like environment files
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: pnpm exec next build
        working-directory: web
      - name: Verify built dashboard and fail-closed risk proxy
        working-directory: web
        run: |
          pnpm exec next start -p 3000 > /tmp/dashboard.log 2>&1 &
          dashboard_pid=$!
          trap 'kill $dashboard_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ && break
            sleep 1
          done
          DASHBOARD_URL=http://127.0.0.1:3000 node scripts/verify-dashboard.mjs
